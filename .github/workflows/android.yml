name: MindGuard Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build Android release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version
          gradle --version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run Android unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest

      - name: Validate release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is missing"; exit 1; }

      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          keytool -list             -keystore android/app/upload-keystore.jks             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS"             >/dev/null

          echo "Release signing configuration verified."

      - name: Clean previous Flutter/Gradle outputs
        run: flutter clean

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Build signed Android App Bundle
        run: flutter build appbundle --release

      - name: Verify all three deliverables
        run: |
          set -euo pipefail

          test -s build/app/outputs/flutter-apk/app-debug.apk
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab

          mkdir -p release-artifacts

          cp build/app/outputs/flutter-apk/app-debug.apk release-artifacts/mindguard-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/mindguard-release.apk
          cp build/app/outputs/bundle/release/app-release.aab release-artifacts/mindguard-release.aab

          printf '\nGenerated deliverables:\n'
          ls -lh release-artifacts/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mindguard-debug-apk
          path: release-artifacts/mindguard-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mindguard-release-apk
          path: release-artifacts/mindguard-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: mindguard-release-aab
          path: release-artifacts/mindguard-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Clean signing material
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/key.properties
