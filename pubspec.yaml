name: content_filter_vpn
description: A content filtering VPN app that monitors and restricts access to specific websites.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  http: ^1.2.0

  permission_handler: ^11.3.0
  connectivity_plus: ^6.0.3 # New dependency for network state monitoring

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
